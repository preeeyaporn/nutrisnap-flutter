name: Flutter CI/CD & Automated Test Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint_and_test:
    name: Code Analysis & Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔍 Static Code Analysis (Linter)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: 🧪 Run Automated Tests with Coverage
        run: flutter test --coverage

      - name: 📊 Verify Minimum 70% Test Coverage
        run: |
          python3 -c "
          with open('coverage/lcov.info') as f:
              lines = f.readlines()
          lh = sum(1 for l in lines if l.startswith('DA:') and int(l.strip().split(',')[1]) > 0)
          lf = sum(1 for l in lines if l.startswith('DA:'))
          cov = (lh / lf * 100) if lf > 0 else 0
          print(f'✅ Line Coverage: {cov:.2f}% (Minimum Required: 70%)')
          if cov < 70:
              print('❌ ERROR: Coverage below 70%')
              exit(1)
          else:
              print('✅ SUCCESS: Minimum 70% test coverage requirement satisfied!')
          "

      - name: 📤 Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build_verification:
    name: Build Verification
    needs: lint_and_test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🛠️ Build Web Artifact
        run: flutter build web --release
