name: nutrisnap
description: "NutriSnap - AI-powered Smart Nutrition & Barcode Scanner App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  camera: ^0.12.1
  mobile_scanner: ^7.4.2
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.0.0
  image_picker: ^1.2.4
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
